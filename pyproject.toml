[project]
name = "insightpilot"
version = "1.0.0"
description = "A conversational AI data analyst agent built with Claude tool use and Streamlit."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B905"]
